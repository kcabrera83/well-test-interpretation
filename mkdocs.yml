site_name: Well Test Interpretation
site_description: Pressure transient analysis with flow regime identification and permeability estimation.
repo_url: https://github.com/kcabrera83/well-test-interpretation
site_author: Kelvin J Cabrera

theme:
  name: material
  palette:
    primary: indigo
    accent: blue
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.top

nav:
  - Home: index.md
  - API Reference: api.md
  - Models: models.md

markdown_extensions:
  - admonition
  - codehilite
  - toc:
      permalink: true
